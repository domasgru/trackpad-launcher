name: TrackpadLauncher
options:
  bundleIdPrefix: com.domasgru
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  LauncherKit:
    path: LauncherKit
targets:
  TrackpadLauncher:
    type: application
    platform: macOS
    sources:
      - path: TrackpadLauncher
        excludes: ["Info.plist"]
      - path: assets
        includes: ["*.svg", "*.png"]
        buildPhase: resources
    dependencies:
      - package: LauncherKit
        product: LauncherCore
      - package: LauncherKit
        product: LauncherPlatform
      - package: LauncherKit
        product: LauncherUI
    info:
      path: TrackpadLauncher/Info.plist
      properties:
        CFBundleName: Trackpad Launcher
        CFBundleDisplayName: Trackpad Launcher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        SUFeedURL: https://raw.githubusercontent.com/domasgru/trackpad-launcher/main/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: false
        SUVerifyUpdateBeforeExtraction: true
        SUEnableInstallerLauncherService: true
        TLUpdateDownloads: https://github.com/domasgru/trackpad-launcher/releases/download/
    settings:
      base:
        # The bundle's file name is the name Finder, the Dock and Spotlight show; CFBundleDisplayName cannot override it.
        PRODUCT_NAME: Trackpad Launcher
        PRODUCT_MODULE_NAME: TrackpadLauncher
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ONLY_ACTIVE_ARCH: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.domasgru.TrackpadLauncherApp.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.domasgru.TrackpadLauncherApp
