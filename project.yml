name: TrackpadApp
options:
  bundleIdPrefix: com.domasgru
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  LauncherKit:
    path: LauncherKit
targets:
  TrackpadApp:
    type: application
    platform: macOS
    sources:
      - path: TrackpadApp
        excludes: ["Info.plist"]
      - path: assets
        includes: ["*.svg", "*.png"]
        buildPhase: resources
    dependencies:
      - package: LauncherKit
        product: LauncherCore
      - package: LauncherKit
        product: LauncherPlatform
      - package: LauncherKit
        product: LauncherUI
    info:
      path: TrackpadApp/Info.plist
      properties:
        CFBundleName: Trackpad App
        CFBundleDisplayName: Trackpad App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        SUFeedURL: https://raw.githubusercontent.com/domasgru/trackpad-app/main/appcast.xml
        SUPublicEDKey: 7bU2ETbJmXD69AOzuCQ/dtoiWle+FeITZAx6sFHyz4s=
        SUEnableAutomaticChecks: false
        SUVerifyUpdateBeforeExtraction: true
        SUEnableInstallerLauncherService: true
        # The repository's path before its rename to trackpad-app, which GitHub redirects: every shipped version admits
        # only downloads under it, so the feed keeps naming it (Scripts/release.sh, DOWNLOADS).
        TLUpdateDownloads: https://github.com/domasgru/trackpad-launcher/releases/download/
    settings:
      base:
        # The bundle's file name is the name Finder, the Dock and Spotlight show; CFBundleDisplayName cannot override it.
        PRODUCT_NAME: Trackpad App
        PRODUCT_MODULE_NAME: TrackpadApp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ONLY_ACTIVE_ARCH: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.domasgru.TrackpadLauncherApp.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.domasgru.TrackpadLauncherApp
